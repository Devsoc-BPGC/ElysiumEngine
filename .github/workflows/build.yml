name: Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            cc: gcc
            cxx: g++
          - os: macos-latest
            name: macOS
            cc: clang
            cxx: clang++
          - os: windows-latest
            name: Windows
            cc: cl
            cxx: cl

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------------- MSVC environment (Windows) ----------------
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------------- Linux dependencies ----------------
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libudev-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libopenal-dev \
            libvorbis-dev \
            libflac-dev \
            xorg-dev \
            libfreetype-dev \
            libharfbuzz-dev

      # ---------------- macOS dependencies ----------------
      # Only install Ninja. SFML and its deps are built from the submodule,
      # NOT from Homebrew (mixing Homebrew SFML with your submodule causes
      # ABI/version mismatches).
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      # ---------------- ccache for faster rebuilds ----------------
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.cc }}

      # ---------------- Configure ----------------
      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DSFML_BUILD_EXAMPLES=OFF
          -DSFML_BUILD_TEST_PROGRAMS=OFF
          -DSFML_BUILD_DOC=OFF
          -DSFML_INSTALL=OFF
          -DSFML_BUILD_NETWORK=OFF
          -DSFML_BUILD_AUDIO=OFF

      # ---------------- Build ----------------
      - name: Build
        run: cmake --build build --parallel

      # ---------------- Tests ----------------
      - name: Test
        run: ctest --test-dir build --output-on-failure -C ${{ env.BUILD_TYPE }}

      # ---------------- Artifacts ----------------
      - name: Upload ${{ matrix.name }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ElysiumEngine-${{ matrix.name }}
          path: build/bin/
          retention-days: 7
          if-no-files-found: warn