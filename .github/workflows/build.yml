name: Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev \
            libudev-dev libgl1-mesa-dev libglu1-mesa-dev libopenal-dev \
            libvorbis-dev libflac-dev xorg-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install sfml glfw

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSFML_BUILD_NETWORK=OFF \
            -DSFML_BUILD_AUDIO=OFF \
            -DSFML_BUILD_EXAMPLES=OFF \
            -DSFML_BUILD_TEST_PROGRAMS=OFF \
            -DSFML_BUILD_DOC=OFF \
            -DSFML_INSTALL=OFF \
            -DGLFW_BUILD_DOCS=OFF \
            -DGLFW_BUILD_TESTS=OFF \
            -DGLFW_BUILD_EXAMPLES=OFF

      - name: Build
        shell: bash
        working-directory: build
        run: cmake --build . --config ${{ env.BUILD_TYPE }} --parallel 2

      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: build
        run: |
          chmod +x PhysicsPerformanceTest BroadPhasePerformanceTest BoundaryTest FrictionTest
          ./PhysicsPerformanceTest
          ./BroadPhasePerformanceTest
          ./BoundaryTest
          ./FrictionTest

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        run: |
          ./Release/PhysicsPerformanceTest.exe
          ./Release/BroadPhasePerformanceTest.exe
          ./Release/BoundaryTest.exe
          ./Release/FrictionTest.exe
