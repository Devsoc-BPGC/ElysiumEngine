name: Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    # ✅ The runs-on MUST use matrix.os
    runs-on: ${{ matrix.os }}

    # ✅ Strategy goes INSIDE the job
    strategy:
      fail-fast: false # Don't cancel other builds if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Very important if SFML/GLFW are submodules!

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev \
            libudev-dev libgl1-mesa-dev libglu1-mesa-dev libopenal-dev \
            libvorbis-dev libflac-dev xorg-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install sfml glfw

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSFML_BUILD_EXAMPLES=OFF \
            -DSFML_BUILD_TEST_PROGRAMS=OFF \
            -DSFML_BUILD_DOC=OFF \
            -DSFML_INSTALL=OFF \
            -DGLFW_BUILD_DOCS=OFF \
            -DGLFW_BUILD_TESTS=OFF \
            -DGLFW_BUILD_EXAMPLES=OFF

      - name: Build
        working-directory: build
        run: cmake --build . --config ${{ env.BUILD_TYPE }} --parallel 2

      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: build
        run: |
          ./PhysicsPerformanceTest
          ./BroadPhasePerformanceTest
          ./BoundaryTest
          ./FrictionTest

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        run: |
          ./${{ env.BUILD_TYPE }}/PhysicsPerformanceTest.exe
          ./${{ env.BUILD_TYPE }}/BroadPhasePerformanceTest.exe
          ./${{ env.BUILD_TYPE }}/BoundaryTest.exe
          ./${{ env.BUILD_TYPE }}/FrictionTest.exe
